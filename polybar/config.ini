[colors]
background = #121212
foreground = #e6e6e6
primary = #f0f0f0
secondary = #2b2b2b
accent = #cfcfcf

[bar/main]
width = 100%
height = 26
#bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
padding-left = 1
padding-right = 1

font-0 = Noto Sans:style=Bold:size=10;2

modules-left = i3
modules-center = date
modules-right = wlan separator battery separator pulseaudio separator cpu separator memory separator tray

tray-position = right
tray-padding = 2

wm-restack = i3
override-redirect = false
content-padding = 2


[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true

label-focused = %index%
label-focused-background = ${colors.secondary}
label-focused-foreground = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 2

label-visible = %index%
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = #ffffff
label-urgent-foreground = #121212
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M | %d/%m/%y
label = %date%

[module/separator]
type = custom/text
content = | 
content-padding = 1

[module/wlan]
type = internal/network
interface = wlp0s20f3
interval = 3

format-connected = WIFI: <label-connected>
format-disconnected = WIFI: OFF

label-connected = %essid%
label-disconnected = OFF

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

label-charging = BAT: %percentage%%
label-discharging = BAT: %percentage%%
label-full = BAT: %percentage%%

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

[module/cpu]
type = internal/cpu
interval = 2
label = CPU: %percentage%%

[module/memory]
type = internal/memory
interval = 2
label = RAM: %percentage_used%%

[module/tray]
type = internal/tray


[module/pulseaudio]
type = internal/pulseaudio

; Mostra apenas "VOL: XX%"
format-volume = <label-volume>
label-volume = VOL: %percentage%%
label-volume-foreground = ${colors.primary}

; O que aparece quando está mutado
format-muted = <label-muted>
label-muted = VOL: MUTED
label-muted-foreground = #666
